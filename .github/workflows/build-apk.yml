name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          [ -n "$YT_API_KEY" ] || { echo "YT_API_KEY secret যোগ করা হয়নি"; exit 1; }
          mkdir -p www assets
          cp index.html www/
          K=$(printf '%s' "$YT_API_KEY" | tr -d '[:space:]') node -e "const f='www/index.html',fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f,'utf8').split('__YT_API_KEY__').join(process.env.K))"
          mv icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png assets/

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidTube-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
