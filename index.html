<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b12"><title>LiquidTube</title>
<style>
:root{--bg:#0b0b12;--cd:#171722;--ln:rgba(255,255,255,.09);--tx:#f5f5fa;--mu:#9b9bb0;--ac:#ff2d55;--g:linear-gradient(135deg,#ff2d55,#8b5cf6)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:500 14px/1.35 system-ui,-apple-system,'Hind Siliguri',sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
#app{height:100%;display:flex;flex-direction:column}
#vs{flex:1;position:relative;min-height:0}
.v{position:absolute;inset:0;display:none;flex-direction:column}.v.on{display:flex}
.sc{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px}
header{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
.lg{width:32px;height:32px;border-radius:10px;background:var(--g);display:grid;place-items:center;box-shadow:0 4px 18px rgba(255,45,85,.45)}
.lg:after{content:'';border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
h1{font-size:21px;font-weight:800;letter-spacing:-.6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none;flex:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--ln);backdrop-filter:blur(12px)}
.chips button.on{background:var(--g);border-color:transparent;font-weight:700}
#ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--mu);font-size:12.5px;transition:height .2s}
.cd{display:block;margin-bottom:22px}
.th{position:relative;aspect-ratio:16/9;background:var(--cd);overflow:hidden;margin:0 12px;border-radius:18px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);padding:2px 7px;border-radius:7px;font-size:12px}
.mt{display:flex;gap:12px;padding:10px 16px 0}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-style:normal;font-weight:800}
.mt h3{font-size:15px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt p{color:var(--mu);font-size:12.5px;margin-top:3px}
.sk{aspect-ratio:16/9;margin:0 12px 70px;border-radius:18px;background:linear-gradient(90deg,#171722,#242436,#171722);background-size:200%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200%}}
.em{text-align:center;color:var(--mu);padding:60px 28px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pill{padding:9px 18px;border-radius:99px;background:var(--g);font-weight:700;color:#fff}
nav{display:flex;background:rgba(14,14,22,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu)}
nav button.on{color:var(--ac)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb{margin:calc(14px + env(safe-area-inset-top)) 16px 0;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:18px;padding:0 16px;flex:none;color:var(--mu)}
.sb input{flex:1;height:48px;color:var(--tx)}
.seg{display:flex;gap:8px;padding:calc(16px + env(safe-area-inset-top)) 16px 8px;flex:none}
.seg button{padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.07)}.seg .on{background:var(--g);font-weight:700}
#sh.on{display:block;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;scrollbar-width:none}
.s{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000 center/cover}
.s iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ov{position:absolute;inset:0;z-index:2}
.inf{position:absolute;left:0;right:70px;bottom:0;padding:70px 16px 20px;background:linear-gradient(transparent,rgba(0,0,0,.85));z-index:3;pointer-events:none}
.inf p{margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.s .fv{position:absolute;right:12px;bottom:100px;z-index:3;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:grid;place-items:center}
.fv.on{color:var(--ac)}.fv.on svg{fill:currentColor}
#pl{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow-y:auto}#pl.on{display:block}
.stk{position:sticky;top:0;z-index:3;background:var(--bg)}
.bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.bar button{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center}
#pv{aspect-ratio:16/9;background:#000;position:relative}#pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#pi{padding:14px 16px}#pi h2{font-size:18px;line-height:1.35}.mu{color:var(--mu);margin-top:4px;font-size:13px}
.row{display:flex;align-items:center;gap:12px;margin-top:14px}.row b{flex:1}
.row .fv{padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.1)}
.nx{padding:4px 16px 12px;font-weight:700;font-size:16px}
</style></head><body><div id="app"><div id="vs">
<div class="v on" id="hm"><header><i class="lg"></i><h1>LiquidTube</h1></header><div class="chips" id="ch"></div>
<div class="sc" id="hs"><div id="ptr">↓ টেনে রিফ্রেশ করুন</div><div id="fd"></div><div class="sn"></div></div></div>
<div class="v" id="sh"></div>
<div class="v" id="sr"><div class="sb"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg><input id="q" placeholder="ভিডিও খুঁজুন" enterkeyhint="search"></div>
<div class="chips" id="rc"></div><div class="sc"><div id="sf"></div><div class="sn"></div></div></div>
<div class="v" id="lb"><div class="seg"><button data-t="lt_h" class="on">ইতিহাস</button><button data-t="lt_f">পছন্দের</button></div><div class="sc"><div id="ll"></div></div></div>
</div>
<nav>
<button class="on" data-n="hm"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>হোম</button>
<button data-n="sh"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>শর্টস</button>
<button data-n="sr"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>সার্চ</button>
<button data-n="lb"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>লাইব্রেরি</button>
</nav></div>
<div id="pl"><div class="stk"><div class="bar"><button id="cb"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>এখন চলছে</b></div><div id="pv"></div></div><div id="pi"></div><div class="nx">পরের ভিডিও</div><div id="pn"></div></div>
<script>
const KEY='__YT_API_KEY__',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],M={};
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur=s=>{const h=s/3600|0,m=s%3600/60|0,x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const sec=d=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d)||[];return(m[1]|0)*3600+(m[2]|0)*60+(m[3]|0)};
const nf=n=>{const f=x=>+x.toFixed(1)+'';return n>=1e7?f(n/1e7)+' কোটি':n>=1e5?f(n/1e5)+' লাখ':n>=1e3?f(n/1e3)+' হাজার':n+''};
const ago=d=>{const s=(Date.now()-new Date(d))/864e5;return s<1?'আজ':s<30?(s|0)+' দিন আগে':s<365?(s/30|0)+' মাস আগে':(s/365|0)+' বছর আগে'};
const SK='<div class="sk"></div>'.repeat(3);
const err=e=>`<div class="em"><p>${e.message=='KEY'?'অ্যাপের সেটআপ সম্পূর্ণ হয়নি: API Key যুক্ত নেই।':e.message=='quotaExceeded'?'আজকের লোডের সীমা শেষ। কাল আবার চেষ্টা করুন।':'লোড করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।'}</p><button class="pill" onclick="location.reload()">আবার চেষ্টা</button></div>`;
async function api(ep,p){if(KEY[0]=='_')throw Error('KEY');const u=new URL('https://www.googleapis.com/youtube/v3/'+ep);u.search=new URLSearchParams({...p,key:KEY});const r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error?.errors?.[0]?.reason||'net');return d}
const P='snippet,statistics,contentDetails,status';
const V=i=>{const v={id:i.id,t:i.snippet.title,ch:i.snippet.channelTitle,v:+i.statistics?.viewCount||0,sec:sec(i.contentDetails.duration),pub:i.snippet.publishedAt,emb:i.status?.embeddable!==false};M[v.id]=v;return v};
const det=async ids=>ids.length?(await api('videos',{part:P,id:ids.join(',')})).items.map(V).filter(v=>v.emb):[];
const card=v=>`<article class="cd" data-id="${v.id}"><div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt=""><b>${dur(v.sec)}</b></div><div class="mt"><i class="av">${esc([...v.ch][0]||'?')}</i><div><h3>${esc(v.t)}</h3><p>${esc(v.ch)} • ${nf(v.v)} ভিউ • ${ago(v.pub)}</p></div></div></article>`;
async function fill(b,fn,reset){if(b._k)return;b._k=1;b._fn=fn;if(reset){b._t='';b.innerHTML=SK}
try{const r=await fn(b._t);b._t=r.next;if(reset)b.innerHTML='';b.insertAdjacentHTML('beforeend',r.items.map(card).join(''));if(!b.children.length)b.innerHTML='<p class="em">কিছু পাওয়া যায়নি</p>'}
catch(e){b._t='';b.innerHTML=err(e)}b._k=0}
const IOs=new IntersectionObserver(es=>es.forEach(e=>{const b=e.target.previousElementSibling;if(e.isIntersecting&&b._t)fill(b,b._fn)}),{rootMargin:'700px'});
$$('.sn').forEach(s=>IOs.observe(s));
/* হোম */
const CATS=[['সব',''],['গান',10],['গেমিং',20],['বিনোদন',24],['কমেডি',23],['খবর',25],['প্রযুক্তি',28],['খেলাধুলা',17]];
let cat='',reg='BD';const rnd=a=>a[Math.random()*a.length|0];
const homeFn=async t=>{const p={part:P,chart:'mostPopular',maxResults:25,regionCode:reg};if(cat)p.videoCategoryId=cat;if(t)p.pageToken=t;
let d;try{d=await api('videos',p)}catch(e){if(reg!='US'){reg='US';return homeFn(t)}throw e}
const it=d.items.map(V).filter(v=>v.emb&&v.sec>60);if(!t)it.sort(()=>Math.random()-.5);return{items:it,next:d.nextPageToken}};
$('#ch').innerHTML=CATS.map(([n,c],i)=>`<button data-c="${c}" class="${i?'':'on'}">${n}</button>`).join('');
$('#ch').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#ch button').forEach(x=>x.classList.toggle('on',x==b));cat=b.dataset.c;reg=rnd(['BD','BD','IN','US']);$('#hs').scrollTop=0;fill($('#fd'),homeFn,1)};
const hs=$('#hs'),ptr=$('#ptr');let y0=null;
hs.addEventListener('touchstart',e=>{y0=hs.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
hs.addEventListener('touchmove',e=>{if(y0==null)return;const d=e.touches[0].clientY-y0;if(d>0){ptr.style.transition='none';ptr.style.height=Math.min(d/2.2,64)+'px';ptr.textContent=d>150?'ছেড়ে দিন':'↓ টেনে রিফ্রেশ করুন';ptr.dataset.go=d>150?1:''}},{passive:true});
hs.addEventListener('touchend',async()=>{if(y0==null)return;y0=null;ptr.style.transition='';if(ptr.dataset.go){ptr.dataset.go='';ptr.style.height='44px';ptr.textContent='নতুন ভিডিও আনা হচ্ছে…';reg=rnd(['BD','BD','IN','US','GB']);await fill($('#fd'),homeFn,1)}ptr.style.height='0'});
/* সার্চ */
const srFn=q=>async t=>{const p={part:'snippet',type:'video',maxResults:20,q,videoEmbeddable:'true',regionCode:'BD'};if(t)p.pageToken=t;const d=await api('search',p);return{items:await det(d.items.map(i=>i.id.videoId)),next:d.nextPageToken}};
const rcs=()=>{$('#rc').innerHTML=LS('lt_s',[]).map(s=>`<button>${esc(s)}</button>`).join('')};rcs();
function search(q){q=q.trim();if(!q)return;$('#q').value=q;$('#q').blur();SV('lt_s',[q,...LS('lt_s',[]).filter(x=>x!=q)].slice(0,8));rcs();fill($('#sf'),srFn(q),1)}
$('#q').onkeydown=e=>{if(e.key=='Enter')search(e.target.value)};
$('#rc').onclick=e=>{if(e.target.tagName=='BUTTON')search(e.target.textContent)};
/* শর্টস */
const SQ=['#shorts','funny #shorts','music #shorts','বাংলা #shorts','cricket #shorts','gaming #shorts','cooking #shorts','travel #shorts','comedy #shorts','tech #shorts'];
const HEART='<svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.7-8 11-8 11z"/></svg>';
const emb=(id,o='')=>`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0&enablejsapi=1&origin=${location.origin}${o}`;
let shT='',shB=0,shQ='',shInit=0;
const shCard=v=>`<section class="s" style="background-image:url(https://i.ytimg.com/vi/${v.id}/hqdefault.jpg)" data-v="${v.id}"><div class="ov"></div><div class="inf"><b>@${esc(v.ch)}</b><p>${esc(v.t)}</p></div><button class="fv" data-f="${v.id}">${HEART}</button></section>`;
async function shMore(){if(shB)return;shB=1;const box=$('#sh');
try{const p={part:'snippet',type:'video',videoDuration:'short',maxResults:25,videoEmbeddable:'true',q:shQ};if(shT)p.pageToken=shT;const d=await api('search',p);shT=d.nextPageToken||'';
const it=(await det(d.items.map(i=>i.id.videoId))).filter(v=>v.sec<=61);if(!shInit)box.innerHTML='';shInit=1;box.insertAdjacentHTML('beforeend',it.map(shCard).join(''));
$$('#sh .s:not([data-o])').forEach(e=>{e.dataset.o=1;io.observe(e)});mark()}
catch(e){if(!shInit)box.innerHTML=err(e)}shB=0}
const act=s=>{$$('#sh iframe').forEach(f=>f.remove());s._p=0;s.insertAdjacentHTML('afterbegin',`<iframe src="${emb(s.dataset.v,`&controls=0&loop=1&playlist=${s.dataset.v}&modestbranding=1`)}" allow="autoplay;encrypted-media;picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>`);hist(M[s.dataset.v])};
const io=new IntersectionObserver(es=>es.forEach(e=>{const s=e.target;if(e.isIntersecting){act(s);const a=[...$('#sh').children];if(a.indexOf(s)>=a.length-4&&shT)shMore()}else s.querySelector('iframe')?.remove()}),{root:$('#sh'),threshold:.7});
const tog=s=>{const f=s.querySelector('iframe');if(!f)return;s._p=!s._p;f.contentWindow.postMessage(JSON.stringify({event:'command',func:s._p?'pauseVideo':'playVideo',args:''}),'*')};
/* প্লেয়ার */
const hist=v=>{if(v)SV('lt_h',[v,...LS('lt_h',[]).filter(x=>x.id!=v.id)].slice(0,40))};
function mark(){const s=new Set(LS('lt_f',[]).map(x=>x.id));$$('[data-f]').forEach(b=>b.classList.toggle('on',s.has(b.dataset.f)))}
function tf(id){let a=LS('lt_f',[]);a=a.some(x=>x.id==id)?a.filter(x=>x.id!=id):[M[id],...a];SV('lt_f',a);mark();if($('#lb').classList.contains('on'))lib()}
function play(id){const v=M[id];if(!v)return;$('#pl').classList.add('on');$('#pl').scrollTop=0;
$('#pv').innerHTML=`<iframe src="${emb(id,'&modestbranding=1')}" allow="autoplay;fullscreen;picture-in-picture;encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
$('#pi').innerHTML=`<h2>${esc(v.t)}</h2><p class="mu">${nf(v.v)} ভিউ • ${ago(v.pub)}</p><div class="row"><i class="av">${esc([...v.ch][0]||'?')}</i><b>${esc(v.ch)}</b><button class="fv" data-f="${id}">♥ পছন্দ</button></div>`;
$('#pn').innerHTML=Object.values(M).filter(x=>x.id!=id&&x.sec>60).sort(()=>Math.random()-.5).slice(0,14).map(card).join('');mark();hist(v);history.pushState({p:1},'')}
function shut(){$('#pl').classList.remove('on');$('#pv').innerHTML=''}
$('#cb').onclick=()=>history.back();addEventListener('popstate',shut);
document.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){tf(f.dataset.f);return}const o=e.target.closest('.ov');if(o){tog(o.parentNode);return}const c=e.target.closest('[data-id]');if(c)play(c.dataset.id)});
/* লাইব্রেরি */
let lt='lt_h';function lib(){const a=LS(lt,[]);a.forEach(v=>M[v.id]=v);$('#ll').innerHTML=a.length?a.map(card).join(''):'<p class="em">এখানে এখনো কিছু নেই।<br>ভিডিও দেখলে বা ♥ দিলে এখানে জমা হবে।</p>'}
$('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;lt=b.dataset.t;$$('.seg button').forEach(x=>x.classList.toggle('on',x==b));lib()};
/* নেভিগেশন */
function go(n){$$('.v').forEach(e=>e.classList.toggle('on',e.id==n));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.n==n));$$('#sh iframe').forEach(f=>f.remove());
if(n=='sh'&&!shInit&&!shB){$('#sh').innerHTML=SK;shQ=rnd(SQ);shMore()}if(n=='lb')lib()}
$$('nav button').forEach(b=>b.onclick=()=>go(b.dataset.n));
fill($('#fd'),homeFn,1);
</script></body></html>
